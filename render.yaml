# Render Blueprint — best-effort starting point, not a verified-working config.
# Render's managed-Redis product naming and free-tier availability have changed over
# time; check https://render.com/docs/blueprint-spec against this file before relying
# on it, and see docs/DEPLOY.md for the full walkthrough plus the DATABASE_URL scheme
# fix every Render/Railway deploy needs (postgres:// -> postgresql+psycopg://).

databases:
  - name: pulse-postgres
    databaseName: pulse
    user: pulse
    plan: free

services:
  - type: redis
    name: pulse-redis
    plan: free
    ipAllowList: []

  - type: web
    name: pulse-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pulse-redis
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

  # Declared as `web`, not `worker`, deliberately: Render's Background Worker product
  # has no free tier (minimum $7/mo), but its Web Service product does, and the
  # consumer accepts no HTTP traffic by design. consumer/health_server.py binds a
  # trivial HTTP health endpoint to Render's injected $PORT purely to satisfy this
  # platform requirement — inert everywhere else (docker-compose, plain `python -m
  # consumer.main`), since PORT is never set there. See docs/DEPLOY.md.
  - type: web
    name: pulse-consumer
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.consumer
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: pulse-redis
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
